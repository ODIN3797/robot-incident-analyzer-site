name: Smoke deployed public Pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact deployed homepage, genuine fictional report and SHA
        run: python scripts/check_launch_links.py --live
